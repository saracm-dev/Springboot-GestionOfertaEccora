spring.application.name=gestion-ofertas

# Conexion a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eccora_gestion_ofertas}
spring.datasource.username=${DB_USERNAME:eccora_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Desactivar Docker Compose para la instalacion local
spring.docker.compose.enabled=false

